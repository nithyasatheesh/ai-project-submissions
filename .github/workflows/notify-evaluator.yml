name: Send new submission for evaluation

# Starts the evaluator as soon as a participant uploads, so results arrive in ~2-3 minutes.
# Needs the EVALUATOR_TRIGGER_TOKEN secret: a fine-grained token for the evaluator repo
# with only "Actions: Read and write" (it can start evaluations, nothing else).
on:
  push:
    branches: [main]
    paths:
      - "Submission-Milestone1/**"
      - "Submission-Milestone2/**"
      - "Submission-Milestone3/**"
      - "Submission-Milestone4/**"

permissions: {}

concurrency:
  group: notify-evaluator
  cancel-in-progress: true

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Start evaluation
        env:
          TOKEN: ${{ secrets.EVALUATOR_TRIGGER_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::EVALUATOR_TRIGGER_TOKEN secret is missing in this repository."
            exit 1
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/nithyasatheesh/AI_Project_Evaluator/actions/workflows/evaluate-submissions.yml/dispatches \
            -d '{"ref":"main","inputs":{"source":"upload"}}'
          echo "Evaluation started. Your PDF result will appear in Results/ in about 2-3 minutes."
